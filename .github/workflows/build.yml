
name: Build Rust Inventory 1.12.2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Build mod
        run: gradle --no-daemon setupDecompWorkspace build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: RustInventory-Forge-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
